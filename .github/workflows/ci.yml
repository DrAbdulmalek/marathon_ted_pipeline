name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ted
          POSTGRES_PASSWORD: ted
          POSTGRES_DB: ted2srt
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U ted"
          --health-interval 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ara tesseract-ocr-eng

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          # أدوات الفحص **مثبّتة الإصدار**: ruff بلا تثبيت غيّر مجموعة قواعده
          # الافتراضية بين الإصدارات، فكان نفس الكود أخضر في يوم وأحمر في آخر.
          # (مقياس 2026-10-03: ruff 0.16.10 على `ruff check src/ tests/` بلا
          #  --select = 361 خطأ؛ وبـ --select E9,F63,F7,F82 = صفر.)
          pip install pytest pytest-asyncio pytest-cov "ruff==0.16.10" "mypy==1.18.2"

      - name: Lint with ruff (critical rules — blocking)
        # E9 = أخطاء صياغة/تنفيذ، F63 = مقارنات خاطئة، F7 = أخطاء تركيبية،
        # F82 = أسماء غير معرّفة. هذه هي الأعطال الحقيقية.
        # الفحص الأسلوبي الكامل (361 نتيجة اليوم) يُشغَّل **استشارياً** في الخطوة
        # التالية حتى لا يحجب بوابة الدمج، وحتى لا يختفي تماماً.
        run: ruff check src/ tests/ --select E9,F63,F7,F82

      - name: Lint with ruff (full style report — informational)
        run: ruff check src/ tests/ --output-format=github --exit-zero

      - name: Type check with mypy (ratchet — fails only when it gets worse)
        # كان `|| true` = أخضر كاذب: 25 خطأ أنواع تمر بلا أثر ولا سجل.
        # والحل ليس إزالة `|| true` وحدها (تُحمرّ CI فوراً وتُجمّد الدمج) بل
        # **آلية ratchet**: يُقبل العدد الحالي كخط أساس مُودَع في المستودع، ويفشل
        # البناء عند أي زيادة، ويُطلب تحديث خط الأساس صراحةً عند كل نقصان.
        run: |
          set -uo pipefail
          BASELINE_FILE=".github/mypy-baseline.txt"
          mypy src/ --ignore-missing-imports --no-strict-optional > mypy-report.txt 2>&1 || true
          cat mypy-report.txt
          COUNT=$(grep -cE "^src/.*: error:" mypy-report.txt || true)
          BASELINE=$(cat "$BASELINE_FILE" 2>/dev/null || echo 0)
          echo "mypy errors: $COUNT (baseline: $BASELINE)"
          if [ "$COUNT" -gt "$BASELINE" ]; then
            echo "::error::mypy regressions: $COUNT > baseline $BASELINE. Fix them, or lower the baseline deliberately in $BASELINE_FILE."
            exit 1
          fi
          if [ "$COUNT" -lt "$BASELINE" ]; then
            echo "::notice::mypy improved to $COUNT — lower $BASELINE_FILE to lock the gain in."
          fi

      - name: Run tests
        env:
          REDIS_URL: redis://localhost:6379/0
          AUTH_DB: /tmp/test_auth.db
          WEBHOOK_DB: /tmp/test_webhooks.db
        run: |
          pytest tests/ -v --cov=src --cov-report=xml --cov-report=term

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  build-and-push:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-scan:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

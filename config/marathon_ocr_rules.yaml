version: 2
name: marathon_ocr_visual_evidence_charter
description: >
  ميثاق حفظ الدليل البصري في OCR — ليس محرك تنظيف نصوص.
  الغرض: الفصل الدلالي بين الصحيح/الخاطئ/المشكوك وحفظ الرموز والألوان
  كدليل قابل للتدقيق، مع منع تصحيح المصدر بصمت ومنع تلويث بيانات التدريب.
  قواعد التنظيف النصي (R01-R18 السابقة) انتقلت إلى config/text_normalization_rules.yaml
  وتعمل كمرحلة تهيئة (pre-pass) قبل هذا الميثاق.

# المبادئ 1-18 من الأصل — كعقيدة غير قابلة للتجاوز
principles:
  p01_goal: >
    النص المستخرج لا يُعتبر صحيحًا تلقائيًا. يجب التمييز بين:
    النص الأساسي الموثوق، المثال التعليمي، الخطأ المقصود،
    التصحيح، المشكوك فيه، والدليل البصري الدلالي.
  p02_telegram_intake:
    - تنزيل الملف الأصلي دون تعديل
    - الاحتفاظ بالامتداد الأصلي
    - حساب SHA-256
    - تسجيل المصدر والقناة والتاريخ
    - عدم اعتبار اسم الملف دليلًا على المحتوى
  p03_tables: الحفاظ على البنية والعلاقات بين الخلايا. Markdown مفضل. لا اختراع بنية غير مؤكدة.
  p04_images_not_truth: وجود نص في صورة لا يعني صحته — قد يكون مثالًا، خطأً، أو مقارنة.
  p05_images_with_text: البحث عن مؤشرات الصحة/الخطأ قبل اعتبار المحتوى حقيقة.
  p06_marker_semantics: >
    ✓ ✔ = صحيح؛ ✗ ✘ X = خاطئ — لكن فقط بعد فحص السياق.
    X قد تكون رمزًا طبيًا أو جزءًا من النص.
  p07_color_semantics: >
    أحمر = خاطئ، أخضر = صحيح — فقط إن وُجد Legend.
    بدون Legend: COLOR_SEMANTICS_UNCERTAIN.
  p08_correct_vs_wrong: لا خلط في خلية واحدة، لا عكس أعمدة، لا حذف علامات، لا اعتبار الأول مرجعيًا.
  p09_error_examples: الصور التعليمية للأخطاء تُصنَّف EXAMPLE_OF_ERROR، لا تدخل كحقيقة.
  p10_uncertainty: عدم اليقين يُعلَن صراحةً (VISUAL_CONFIDENCE_LOW / VISUAL_INTERPRETATION_UNCERTAIN) — لا اختلاق قرار.
  p11_no_inventing: "عند التعارض، لا إجبار الاتساق. الأولوية: المصدر > البنية > العلامات > السياق > النص."
  p12_no_silent_fix: الخطأ المقصود يُحفظ كما هو. التصحيح يُضاف في حقل منفصل.
  p13_visual_metadata: حفظ source_type, page, image_index, ocr_text, visual_status, visual_marker, color_status, confidence.
  p14_medical_strict: "في الطب، الفصل صارم: source/correct/incorrect/suggested/educational. لا تحويل مثال خاطئ إلى صحيح."
  p15_training_data: الترجمة الخاطئة لا تدخل كـtarget. positive_example فقط عند دليل كافٍ. الباقي uncertain.
  p16_output: "Markdown مفضل عند حفظ الجداول. عند العجز: احفظ نسخة خام + Markdown منظم + الإشارة للفقد."
  p17_final_review: التحقق من الجداول، الأعمدة، الصور، ✓/✗/X، الألوان، الفصل، الأمثلة، عدم اليقين، وعدم التصحيح الصامت.
  p18_core_principle: >
    "OCR extracts what is visible; it does not automatically determine what is true."
    الحفاظ على الفرق بين ما يقوله المصدر وما تشير الصورة إلى صحته وما لم نتحقق منه.

visual_markers:
  correct:
    - "✓"    # U+2713
    - "✔"    # U+2714
    - "☑"    # U+2611
  incorrect:
    - "✗"    # U+2717 — كان محذوفًا في المُعاد بناؤه
    - "✘"    # U+2718 — كان محذوفًا
    - "X"    # ASCII X — كان محذوفًا
    - "x"    # ASCII x
    - "✖"    # U+2716
    - "❌"   # U+274C
  caution: >
    X ليست دائمًا خاطئة. قد تكون رمزًا طبيًا، إشارة ضرب،
    أو حرفًا في اسم. يجب فحص السياق البصري قبل التصنيف.
  context_keywords:
    correct: ["correct", "right", "صحيح", "صواب", "الترجمة الصحيحة"]
    incorrect: ["incorrect", "wrong", "error", "خطأ", "خاطئ", "الترجمة الخاطئة"]
    revision: ["correction", "revised", "suggested translation", "التصحيح", "مقترح"]

color_semantics:
  rule: "لا تُفسَّر الألوان دون Legend صريح"
  red_intent: "incorrect"
  green_intent: "correct"
  yellow_intent: "warning_or_review"
  require_legend: true
  legend_keywords: ["legend", "key", "مفتاح", "دليل", "correct:", "incorrect:", "صحيح:", "خاطئ:"]
  on_missing_legend: "COLOR_SEMANTICS_UNCERTAIN"

classification_labels:
  positive_example: "جملة مشار إليها بصريًا كصحيحة"
  negative_example: "جملة مشار إليها بصريًا كخاطئة"
  example_of_error: "صورة توضح خطأً لأغراض تعليمية"
  incorrect_example: "مثال خطأ مقصود في مصدر تعليمي"
  visual_correction_example: "صورة تعرض خطأً ثم تصحيحه"
  uncertain: "لا يمكن الجزم"
  neutral: "لا دليل بصري على صحة/خطأ"

uncertainty_flags:
  visual_confidence_low: "VISUAL_CONFIDENCE_LOW"
  visual_interpretation: "VISUAL_INTERPRETATION_UNCERTAIN"
  color_semantics: "COLOR_SEMANTICS_UNCERTAIN"

visual_metadata_schema:
  source_type: "pdf | epub | image | telegram"
  page: "int"
  image_index: "int"
  ocr_text: "string"
  visual_status: "correct | incorrect | uncertain | neutral"
  visual_marker: "check | x | other | none"
  color_status: "green | red | other | uncertain"
  confidence: "high | medium | low"

training_data_rules:
  positive_example:
    required_evidence: ["visual_marker=check"]
    also_acceptable: ["color_status=green + legend_present"]
  negative_example:
    required_evidence: ["visual_marker=x"]
    also_acceptable: ["color_status=red + legend_present"]
  never_as_target: "negative_example"
  uncertain_handling: "لا يُستخدم كمرجع دون مراجعة بشرية"

# توافق العرض: cmd_rules في telegram_bot.py يقرأ table_rules.output_format
table_rules:
  output_format: "markdown"
  preserve_columns: true

output_format:
  preferred: "markdown"
  preserve_columns: true
  if_cannot_represent:
    - "احفظ نسخة خام"
    - "احفظ تمثيل Markdown"
    - "أشر للأجزاء المفقودة"
    - "لا تدّعِ مطابقة بصرية"

final_verification:
  checklist:
    - tables_preserved
    - column_order_preserved
    - images_captured
    - markers_captured
    - color_semantics_preserved
    - correct_incorrect_separated
    - error_examples_flagged
    - uncertainty_flagged
    - no_silent_correction
    - training_safety_verified
    - original_reference_traceable
  verdicts: ["PASS", "PARTIAL", "UNCERTAIN", "FAILED"]

settings:
  language: "ara+eng"
  dpi: 300
  output:
    markdown_suffix: ".md"
    raw_suffix: ".raw.txt"
    metadata_suffix: ".meta.json"
    negative_example_suffix: ".negative.json"

# =============================================================================
# marathon_ocr_rules.yaml — v2: VISUAL EVIDENCE CHARTER
# =============================================================================
# هذا الملف ميثاق «الدليل البصري» لمعالجة OCR في Marathon TED Pipeline.
#
# القاعدة الحاكمة (ولماذا هذا الإصدار موجود):
#   نص OCR «نظيف» ليس دليلاً على أنه «صحيح». صفحة مليئة بجمل عربية سليمة
#   الإملاء قد تكون مثالاً على خطأ مقصود في المصدر. تصنيف المحتوى بأنه
#   positive_example اعتماداً على نسبة سلامة الكلمات وحدها يسمّم بيانات التدريب
#   بصمت — وهو أخطر فشل في هذا المشروع لأنه غير مرئي في المخرجات.
#   لذلك: الصحة/الخطأ تُستنتج من **دليل بصري** (رمز ✓/✗، لون + مفتاح ألوان،
#   تسمية صريحة في المصدر)، وإلا فالنتيجة `uncertain` — لا `correct`.
#
# التوافق (مهم):
#   * الإصدار 1 (قواعد R01-R18) محفوظ حرفياً في
#     config/text_normalization_rules.yaml ويعمل كـ pre-pass مستقل.
#   * هذا الملف **superset**: يحتفظ بقائمة `rules:` نفسها (R01..R18) حتى لا
#     ينكسر OCRProcessor ولا أي اختبار قائم، ويضيف أقسام الميثاق أدناه.
#   * sha256 لنسخة v1 الأصلية وقت الفصل:
#     40aac3d10dacb04455f011ae3aad748d569e793db4ec96cd5611c79a36c60271
#
# الأقسام الجديدة في v2:
#   visual_markers · color_semantics · uncertainty_flags · classification_labels
#   final_verification · training_data_rules · text_normalization_prepass
# =============================================================================
version: 2
name: marathon_ocr_visual_evidence_charter

# ---------- الميثاق: الدليل البصري ----------
visual_markers:
  # رموز لا لبس فيها — تُستخدم مباشرة كدليل بصري.
  correct: ["✓", "✔", "☑", "✅"]
  incorrect: ["✗", "✘", "✖", "❌", "☒", "🚫"]
  caution_symbol: ["⚠", "⚠️", "❗", "‼"]
  # الرموز الغامضة: لا تُعامل كدليل بصري إلا بسياق/مفتاح.
  # السبب: الحرف اللاتيني X يظهر في نص طبي سليم (X-ray، X = متغير، أرقام رومانية،
  # أسماء أدوية وجينات)، وتحويله آلياً إلى «خطأ» يفسد النص السليم.
  ambiguous: ["X", "x"]
  ambiguous_policy: REQUIRE_CONTEXT_OR_LEGEND
  caution: "X ليست دائمًا خاطئة — قد تكون رمزًا طبيًا (X-ray) أو متغيرًا أو رقمًا رومانيًا"

color_semantics:
  # اللون لا يحمل معنى ثابتًا عبر المستندات: الأحمر = خطأ في مستند،
  # و= تنبيه/أولوية في آخر، و= «مهم» في ثالث.
  require_legend: true
  on_missing_legend: COLOR_SEMANTICS_UNCERTAIN
  legend_search_scope: [same_page, facing_page, document_front_matter]
  never_assume:
    red: incorrect
    green: correct

uncertainty_flags:
  # الوسوم المعتمدة. أي عدم يقين يجب أن يظهر كوسم صريح في المخرجات،
  # لا كقرار ضمني — ولا يُصحَّح شيء بصمت (no_silent_correction).
  visual_confidence_low: VISUAL_CONFIDENCE_LOW
  visual_interpretation: VISUAL_INTERPRETATION_UNCERTAIN
  color_semantics: COLOR_SEMANTICS_UNCERTAIN
  ambiguous_marker: AMBIGUOUS_MARKER_NEEDS_CONTEXT
  low_ocr_confidence: OCR_CONFIDENCE_LOW
  emitted_in: [metadata.uncertainty_flags, markdown_inline_marker]

classification_labels:
  # التصنيفات المسموح بها فقط. أي مخرج بلا دليل بصري → uncertain.
  allowed:
    - positive_example          # مثال صحيح مؤكَّد بدليل بصري
    - negative_example          # مثال خاطئ مؤكَّد بدليل بصري
    - example_of_error          # المصدر يعرض الخطأ عمدًا (حالة تدريب حساسة)
    - incorrect_example         # مرادف لـ negative_example (يُوحَّد عند التصدير)
    - visual_correction_example # زوج قبل/بعد مصحَّح بصريًا
    - uncertain                 # لا دليل بصري كافٍ — الافتراضي الآمن
    - neutral                   # محتوى وصفي بلا حكم صحة/خطأ
  default_when_no_visual_evidence: uncertain
  # positive_example و negative_example **ليسا** مترادفين ولا قابلين للتبادل:
  # الأول = المحتوى صحيح، الثاني = المحتوى معروض كمثال على الخطأ.
  must_not_conflate: [[positive_example, negative_example],
                      [positive_example, example_of_error]]

final_verification:
  # قائمة الفحص قبل اعتبار أي مخرَج OCR مقبولاً. كل بند boolean، وأي بند
  # غير محقق يوسم المخرَج ولا يُحذف ولا يُصحَّح بصمت.
  checklist:
    - tables_preserved
    - column_order_preserved
    - images_captured
    - markers_captured
    - color_semantics_preserved
    - correct_incorrect_separated
    - error_examples_flagged
    - uncertainty_flagged
    - no_silent_correction
    - training_safety_verified
    - original_reference_traceable
  blocking: [no_silent_correction, training_safety_verified,
             original_reference_traceable]

training_data_rules:
  # حماية بيانات التدريب من التضليل — جوهر الميثاق.
  never_as_target: negative_example     # لا يُدرَّب النموذج على إنتاج مثال خاطئ
  never_as_target_also: [example_of_error, incorrect_example, uncertain]
  require_label: true
  require_original_reference: true      # مسار/معرف المصدر الأصلي لكل عيّنة
  provenance_fields: [source_file, page, marker_found, legend_found, label, uncertainty_flags]

# pre-pass: قواعد التطبيع النصي (v1) — تُشغَّل قبل أي تصنيف بصري.
text_normalization_prepass:
  file: config/text_normalization_rules.yaml
  version: 1
  sha256: 40aac3d10dacb04455f011ae3aad748d569e793db4ec96cd5611c79a36c60271
  applies_before: classification

# ---------- التنظيف العام ----------
rules:
  - id: R01
    name: strip_control_chars
    description: "حذف محارف التحكم غير المرئية ( bidi marks، zero-width )"
    enabled: true
    category: cleanup

  - id: R02
    name: normalize_unicode_forms
    description: "توحيد أشكال يونيكود (NFKC) للأحرف المتطابقة بصريًا"
    enabled: true
    category: cleanup

  - id: R03
    name: collapse_whitespace
    description: "دمج المسافات المتكررة والحفاظ على فواصل الأسطر"
    enabled: true
    category: cleanup

  - id: R04
    name: fix_line_hyphenation
    description: "وصل الكلمات المقطوعة بشرطة في نهاية السطر"
    enabled: true
    category: structure

  - id: R05
    name: merge_broken_paragraphs
    description: "دمج أسطر الفقرة الواحدة عندما لا ينتهي السطر بعلامة ترقيم"
    enabled: true
    category: structure

  - id: R06
    name: remove_page_numbers
    description: "حذف أرقام الصفحات المعزولة ( أرقام وحدها في سطر )"
    enabled: true
    category: cleanup

  - id: R07
    name: remove_headers_footers
    description: "حذف الترويسات والتذييلات المتكررة أعلى/أسفل الصفحات"
    enabled: true
    category: cleanup

  - id: R08
    name: strip_diacritics
    description: "حذف التشكيل مع خيار الإبقاء في بيانات التعريف"
    enabled: true
    category: cleanup
    params:
      keep_in_metadata: true

  - id: R09
    name: normalize_arabic_letters
    description: "توحيد الألف/الياء/التاء المربوطة ( أ إ آ → ا ، ى → ي ، ة → ه اختياري )"
    enabled: true
    category: substitution
    params:
      alef_variants: true
      ya_maqsura: true
      ta_marbuta: false

  - id: R10
    name: normalize_diacriticless_digits
    description: "توحيد الأرقام العربية-الهندية (٠-٩) إلى (0-9) مع حفظ النسخة الأصلية"
    enabled: true
    category: substitution
    params:
      keep_original: true

  - id: R11
    name: normalize_punctuation
    description: "توحيد علامات الترقيم ( ، ، ؛ ، ؟ ) إلى الصيغة القياسية"
    enabled: true
    category: substitution

  - id: R12
    name: normalize_quotes
    description: "توحيد علامات الاقتباس المزدوجة والمفردة"
    enabled: true
    category: substitution

  - id: R13
    name: common_ocr_substitutions
    description: "جدول أخطاء OCR الشائعة ( و/ؤ ، ه/ة في السياق ، لأ لإ لا )"
    enabled: true
    category: substitution
    params:
      table:
        "ﻻ": "لا"
        "ﻷ": "لأ"
        "ﻹ": "لإ"
        "ﺁ": "آ"

  - id: R14
    name: detect_visual_markers
    description: "كشف علامات الصحة/الخطأ والتحذير وعزلها كدليل بصري؛ لا يستنتج الصحة من النص وحده"
    enabled: true
    category: separation
    params:
      # الرموز غير الغامضة فقط. الحرفان X/x مستثنيان عمداً من `markers`
      # (انظر visual_markers.ambiguous) لأن وسم كل X في نص طبي يفسد
      # X-ray والمتغيرات والأرقام الرومانية.
      markers: ["✓", "✔", "☑", "✗", "✘", "✖", "❌", "☒", "🚫",
                "⚠", "✅", "🔴", "🟢", "🟡", "⭐", "★", "※", "†", "‡"]
      # تُعالَج بسياق/مفتاح فقط، ولا توسم آلياً:
      ambiguous_markers: ["X", "x"]
      ambiguous_flag: AMBIGUOUS_MARKER_NEEDS_CONTEXT
      # مصدر الحقيقة لقوائم الرموز هو قسم visual_markers أعلاه.
      markers_from_charter: true

  - id: R15
    name: flag_uncertain_words
    description: "وسم الكلمات منخفضة الثقة من OCR بعلامة [؟؟] لمراجعة بشرية"
    enabled: true
    category: separation
    params:
      min_word_length: 2
      confidence_threshold: 0.80
      marker: "[؟؟]"

  - id: R16
    name: separate_correct_vs_wrong
    description: "فصل الصحيح والخاطئ فقط عند وجود دليل بصري/سياقي؛ نسبة سلامة OCR ليست دليل صحة"
    enabled: true
    category: separation
    params:
      # --- v2: الميثاق ---
      # require_visual_evidence=true  → نسبة سلامة الكلمات لا تكفي؛ بلا دليل بصري
      #                                 يُصنَّف المقطع `uncertain` (لا correct).
      # الافتراضي false هنا للحفاظ على سلوك v1 واختباراته؛ فرعه
      # audit/visual-evidence-rules يقلبها مع تحديث اختباراتها.
      require_visual_evidence: false
      uncertain_status: "uncertain"
      evidence_markers_from: visual_markers      # قسم الميثاق
      # --- v1: محفوظ للتوافق (يُقرأ فقط عندما require_visual_evidence=false) ---
      correct_ratio_threshold: 0.85   # نسبة الكلمات السليمة لقبول المقطع "صحيحًا"

  - id: R17
    name: detect_lists_and_headings
    description: "كشف العناوين والقوائم وتحويلها لصيغة Markdown (# و -)"
    enabled: true
    category: structure
    params:
      heading_max_words: 12

  - id: R18
    name: extract_footnotes_tables
    description: "عزل الحواشي السفلية (¹ ² أو (1)) والجداول البسيطة إلى أقسام مستقلة"
    enabled: true
    category: separation

# ---------- الإعدادات العامة ----------
settings:
  language: "ara+eng"           # لغات tesseract
  dpi: 300                      # دقة التحويل من PDF
  min_confidence: 0.0           # حد الثقة الأدنى لقبول الصفحة
  output:
    correct_suffix: ""          # الملف الصحيح: <name>.md
    wrong_suffix: ".wrong"      # الملف الخاطئ: <name>.md.wrong
    metadata_suffix: ".meta.json"

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: marathon-worker-hpa
  namespace: marathon
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: marathon-worker
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: marathon-api-hpa
  namespace: marathon
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: marathon-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

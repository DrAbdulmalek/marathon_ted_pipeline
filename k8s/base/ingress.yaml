apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: marathon-ingress
  namespace: marathon
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "200m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/limit-rps: "20"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [marathon.yourdomain.com]
      secretName: marathon-tls
  rules:
    - host: marathon.yourdomain.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: marathon-api
                port: {number: 8000}
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: marathon-api
                port: {number: 8000}
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: marathon-api
                port: {number: 8000}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: marathon-monitor
  namespace: marathon
spec:
  replicas: 1
  selector:
    matchLabels: {app: marathon-monitor}
  template:
    metadata:
      labels: {app: marathon-monitor}
    spec:
      containers:
        - name: monitor
          image: YOUR_REGISTRY/marathon:latest
          command: ["python", "monitor.py"]
          envFrom:
            - configMapRef: {name: marathon-config}
            - secretRef: {name: marathon-secrets}
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: telegram-session
              mountPath: /app/marathon_session.session
              subPath: session
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: marathon-data-pvc
        - name: config
          configMap:
            name: marathon-config-files
        - name: telegram-session
          secret:
            secretName: telegram-session

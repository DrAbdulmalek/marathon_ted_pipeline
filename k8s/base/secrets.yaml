apiVersion: v1
kind: Secret
metadata:
  name: marathon-secrets
  namespace: marathon
type: Opaque
stringData:
  JWT_SECRET_KEY: "change-me"
  PG_PASSWORD: "change-me"
  TELEGRAM_BOT_TOKEN: "change-me"
  BOT_ADMINS: "123456789"
  DEEPL_API_KEY: ""
  APIFY_TOKEN: ""
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: marathon-config
  namespace: marathon
data:
  REDIS_URL: "redis://redis:6379/0"
  TED2SRT_ENDPOINT: "http://ted2srt:3002"
  AUTH_DB: "/app/data/auth.db"
  WEBHOOK_DB: "/app/data/webhooks.db"
